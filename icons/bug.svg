    <path data-icon-part="bug-body" class="usk-i-line" d="M90 128C90 98 106 82 128 82C150 82 166 98 166 128V151C166 182 150 202 128 202C106 202 90 182 90 151Z"/>
    <path data-icon-part="bug-head" class="usk-i-line-3" d="M102 96C108 82 116 76 128 76C140 76 148 82 154 96"/>
    <path data-icon-part="bug-body" class="usk-i-line-2" d="M128 84V200M92 137H164"/>
