<svg overflow="visible" xmlns="http://www.w3.org/2000/svg" class="usk-icon" width="256" height="256" viewBox="0 0 256 256" role="img" aria-labelledby="settings-title settings-desc">
  <title id="settings-title">Settings</title>
  <desc id="settings-desc">Theme-aware SVG icon that follows ui-style-kit-css color scheme variables. Semantic meaning: Configuration and preferences.</desc>
  <style>
.usk-i-bg{fill:var(--usk-icon-bg,rgb(var(--usk-surface-rgb,7 17 31)/.86))}
.usk-i-bg-strong{fill:var(--usk-icon-bg-strong,rgb(var(--usk-surface-strong-rgb,16 27 45)/.94))}
.usk-i-bg-soft{fill:var(--usk-icon-bg-soft,rgb(var(--usk-surface-soft-rgb,12 22 39)/.64))}
.usk-i-primary{fill:var(--usk-icon-primary,rgb(var(--usk-primary-rgb,214 168 79)));stroke:var(--usk-icon-primary,rgb(var(--usk-primary-rgb,214 168 79)))}
.usk-i-secondary{fill:var(--usk-icon-secondary,rgb(var(--usk-secondary-rgb,111 134 184)));stroke:var(--usk-icon-secondary,rgb(var(--usk-secondary-rgb,111 134 184)))}
.usk-i-accent{fill:var(--usk-icon-accent,rgb(var(--usk-accent-rgb,243 210 122)));stroke:var(--usk-icon-accent,rgb(var(--usk-accent-rgb,243 210 122)))}
.usk-i-success{fill:var(--usk-icon-success,rgb(var(--usk-success-rgb,107 214 156)));stroke:var(--usk-icon-success,rgb(var(--usk-success-rgb,107 214 156)))}
.usk-i-warning{fill:var(--usk-icon-warning,rgb(var(--usk-warning-rgb,255 203 91)));stroke:var(--usk-icon-warning,rgb(var(--usk-warning-rgb,255 203 91)))}
.usk-i-danger{fill:var(--usk-icon-danger,rgb(var(--usk-danger-rgb,255 123 123)));stroke:var(--usk-icon-danger,rgb(var(--usk-danger-rgb,255 123 123)))}
.usk-i-line{fill:none;stroke:var(--usk-icon-primary,rgb(var(--usk-primary-rgb,214 168 79)));stroke-width:7;stroke-linecap:round;stroke-linejoin:round}
.usk-i-line-2{fill:none;stroke:var(--usk-icon-secondary,rgb(var(--usk-secondary-rgb,111 134 184)));stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.usk-i-line-3{fill:none;stroke:var(--usk-icon-accent,rgb(var(--usk-accent-rgb,243 210 122)));stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.usk-i-muted{fill:none;stroke:var(--usk-icon-muted,rgb(var(--usk-text-muted-rgb,185 192 204)));stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}
.usk-i-fill-muted{fill:var(--usk-icon-muted,rgb(var(--usk-text-muted-rgb,185 192 204)));stroke:none}
.usk-i-surface{fill:var(--usk-icon-bg,rgb(var(--usk-surface-rgb,7 17 31)/.86));stroke:var(--usk-icon-border,rgb(var(--usk-border-rgb,57 72 97)/.72));stroke-width:5}
.usk-i-glow{filter:drop-shadow(0 0 10px var(--usk-icon-glow,rgb(var(--usk-primary-rgb,214 168 79)/.26)))}
[data-icon-frame]{opacity:var(--usk-icon-frame-opacity,1)}
[data-icon-frame="decor"]{opacity:var(--usk-icon-frame-decor-opacity,var(--usk-icon-frame-opacity,1))}
[data-icon-glyph="play"]{fill:var(--usk-icon-play,var(--usk-icon-foreground,rgb(var(--usk-text-rgb,255 255 255))));stroke:none;opacity:1}
</style>
  <rect data-icon-frame="decor" class="usk-i-surface" x="28" y="28" width="200" height="200" rx="28"/>
  <path class="usk-i-line-2" d="M48 70H90M166 70H208M48 186H88M168 186H208" opacity=".62"/>
  <path class="usk-i-muted" d="M50 212H118M138 212H154M170 212H206" opacity=".7"/>
  <path class="usk-i-bg-strong" stroke="var(--usk-icon-primary,rgb(var(--usk-primary-rgb,214 168 79)))" stroke-width="6" d="M128 58L143 78L168 73L176 98L199 111L189 135L199 158L176 171L168 196L143 191L128 211L113 191L88 196L80 171L57 158L67 135L57 111L80 98L88 73L113 78Z"/><circle class="usk-i-line-2 usk-i-glow" cx="128" cy="135" r="30"/><path class="usk-i-line-3" d="M128 105V116M128 154V165M98 135H109M147 135H158"/>
</svg>
