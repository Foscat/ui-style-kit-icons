    <circle data-icon-part="network-node" class="usk-i-line" cx="72" cy="128" r="18"/>
    <circle data-icon-part="network-node" class="usk-i-line" cx="128" cy="70" r="18"/>
    <circle data-icon-part="network-node" class="usk-i-line" cx="184" cy="128" r="18"/>
    <circle data-icon-part="network-node" class="usk-i-line" cx="128" cy="186" r="18"/>
