<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SVG visual audit</title>
    <link rel="stylesheet" href="https://unpkg.com/ui-style-kit-css@2.1.0/dist/ui-style-kit.visual.min.css">
    <link rel="stylesheet" href="../../dist/ui-style-kit-icons.css">
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-width: 320px;
        padding: 24px;
        color: rgb(var(--usk-text-rgb, 17 24 39));
        background: rgb(var(--usk-bg-rgb, 248 250 252));
        font-family: system-ui, sans-serif;
      }

      header {
        margin: 0 auto 20px;
        max-width: 1400px;
      }

      h1 {
        margin: 0;
        font-size: 20px;
      }

      #iconGrid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(112px, 1fr));
        gap: 12px;
        margin: 0 auto;
        max-width: 1400px;
      }

      .icon-card {
        min-width: 0;
        min-height: 124px;
        display: grid;
        place-items: center;
        align-content: center;
        gap: 8px;
        padding: 12px;
        color: rgb(var(--usk-text-rgb, 17 24 39));
        background: rgb(var(--usk-surface-rgb, 255 255 255));
        border: 1px solid rgb(var(--usk-border-rgb, 203 213 225));
        border-radius: 6px;
      }

      .rendered-icon,
      .rendered-icon > svg,
      .icon-card > svg,
      usk-icon {
        width: var(--audit-icon-size);
        height: var(--audit-icon-size);
        max-width: 100%;
        display: block;
      }

      .icon-card span {
        max-width: 100%;
        overflow: hidden;
        font-size: 12px;
        font-weight: 650;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      body[data-view="semantic"] #iconGrid {
        grid-template-columns: repeat(4, minmax(160px, 1fr));
      }

      body[data-view="paths"] #iconGrid {
        grid-template-columns: repeat(3, minmax(180px, 1fr));
      }

      body[data-view="prototype"] #iconGrid,
      body[data-view="regressions"] #iconGrid {
        grid-template-columns: repeat(auto-fill, minmax(236px, 1fr));
      }

      .semantic-pair {
        min-width: 0;
        padding: 10px;
        color: rgb(var(--usk-text-rgb, 17 24 39));
        background: rgb(var(--usk-surface-rgb, 255 255 255));
        border: 1px solid rgb(var(--usk-border-rgb, 203 213 225));
        border-radius: 6px;
      }

      .semantic-pair > strong {
        display: block;
        margin-block-end: 8px;
        font-size: 12px;
      }

      .semantic-pair-variants {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
      }

      .semantic-pair .icon-card {
        min-height: 108px;
        padding: 8px;
      }
    </style>
  </head>
  <body>
    <header>
      <h1 id="auditTitle">SVG visual audit</h1>
    </header>
    <main id="iconGrid" aria-label="SVG visual audit matrix"></main>
    <script type="module">
      import {
        getPack,
        packs,
        setAssetBaseUrl
      } from "../../dist/ui-style-kit-icons.js";

      const query = new URLSearchParams(location.search);
      const view = [
        "contact",
        "semantic",
        "comparison",
        "paths",
        "prototype",
        "prototype-pack",
        "regressions"
      ].includes(query.get("view"))
        ? query.get("view")
        : "contact";
      const theme = query.get("theme") || "forest-moss";
      const mode = ["light", "dark", "contrast"].includes(query.get("mode"))
        ? query.get("mode")
        : "light";
      const frame = ["auto", "none", "soft"].includes(query.get("frame"))
        ? query.get("frame")
        : "auto";
      const size = query.get("size") === "20" ? 20 : 76;
      const selectedPack = getPack(query.get("pack"));
      const iconId = query.get("icon") || "home";
      const grid = document.querySelector("#iconGrid");
      const title = document.querySelector("#auditTitle");
      const pending = [];
      const prototypeIds = [
        "home",
        "users",
        "video",
        "link",
        "cloud",
        "network",
        "megaphone",
        "palette"
      ];

      document.body.dataset.theme = theme;
      document.body.dataset.mode = mode;
      document.body.dataset.view = view;
      document.body.dataset.ui = selectedPack.uiStyle;
      document.body.style.setProperty("--audit-icon-size", `${size}px`);
      setAssetBaseUrl(new URL("../../", import.meta.url));

      function applyFrame(element) {
        if (frame !== "auto") {
          element.setAttribute("frame", frame);
        }

        if (frame === "none") {
          element.style.setProperty("--usk-icon-frame-opacity", "0");
          element.style.setProperty("--usk-icon-frame-decor-opacity", "0");
        } else if (frame === "soft") {
          element.style.setProperty("--usk-icon-frame-opacity", "0.36");
          element.style.setProperty("--usk-icon-frame-decor-opacity", "0.10");
        }
      }

      function appendLabel(card, text) {
        const label = document.createElement("span");

        label.textContent = text;
        card.append(label);
      }

      function appendComponent(
        pack,
        record,
        label = record.id,
        parent = grid,
        frameOverride = frame
      ) {
        const card = document.createElement("article");
        const icon = document.createElement("usk-icon");

        card.className = "icon-card";
        card.dataset.iconId = record.id;
        card.dataset.packId = pack.id;
        card.dataset.consumptionPath = "component";
        icon.setAttribute("name", record.id);
        icon.setAttribute("pack", pack.id);
        if (frameOverride !== "auto") {
          icon.setAttribute("frame", frameOverride);
        }
        pending.push(
          new Promise((resolve, reject) => {
            icon.addEventListener("usk-icon-load", resolve, { once: true });
            icon.addEventListener(
              "usk-icon-error",
              (event) => reject(event.detail.error),
              { once: true }
            );
          })
        );
        card.append(icon);
        appendLabel(card, label);
        parent.append(card);
      }

      async function appendInline(pack, record) {
        const card = document.createElement("article");
        const wrapper = document.createElement("div");
        const response = await fetch(
          new URL(`../../${pack.sourcePath}/${record.file}`, import.meta.url)
        );

        if (!response.ok) {
          throw new Error(`Unable to fetch inline SVG: ${response.status}`);
        }

        card.className = "icon-card";
        card.dataset.iconId = record.id;
        card.dataset.consumptionPath = "inline";
        wrapper.className = "rendered-icon";
        wrapper.innerHTML = await response.text();
        applyFrame(wrapper);
        card.append(wrapper);
        appendLabel(card, "Inline SVG");
        grid.append(card);
      }

      function appendSprite(pack, record) {
        const card = document.createElement("article");
        const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
        const use = document.createElementNS("http://www.w3.org/2000/svg", "use");

        card.className = "icon-card";
        card.dataset.iconId = record.id;
        card.dataset.consumptionPath = "sprite";
        svg.setAttribute("viewBox", "0 0 256 256");
        use.setAttribute(
          "href",
          new URL(`../../${pack.sprite}${record.symbol}`, import.meta.url)
        );
        svg.append(use);
        applyFrame(svg);
        card.append(svg);
        appendLabel(card, "External sprite");
        grid.append(card);
      }

      if (view === "prototype") {
        title.textContent = `Reference-led prototype: ${theme} / ${mode} / ${size}px`;
        for (const pack of packs) {
          for (const prototypeId of prototypeIds) {
            const record = pack.coreIcons.find(({ id }) => id === prototypeId);
            const pair = document.createElement("section");
            const pairTitle = document.createElement("strong");
            const variants = document.createElement("div");

            pair.className = "semantic-pair";
            pairTitle.textContent = `${pack.name}: ${prototypeId}`;
            variants.className = "semantic-pair-variants";
            pair.append(pairTitle, variants);
            grid.append(pair);
            appendComponent(pack, record, "Border", variants, "auto");
            appendComponent(pack, record, "No border", variants, "none");
          }
        }
      } else if (view === "prototype-pack") {
        title.textContent = `Reference-led prototype: ${selectedPack.name}`;
        for (const prototypeId of prototypeIds) {
          const record = selectedPack.coreIcons.find(
            ({ id }) => id === prototypeId
          );

          appendComponent(selectedPack, record);
        }
      } else if (view === "regressions") {
        const semanticIds = [
          "network",
          "bug",
          "megaphone",
          "link",
          "cloud",
          "users"
        ];

        title.textContent = `Semantic repairs: ${theme} / ${mode}`;
        for (const pack of packs) {
          for (const semanticId of semanticIds) {
            const record = pack.coreIcons.find(({ id }) => id === semanticId);
            const pair = document.createElement("section");
            const pairTitle = document.createElement("strong");
            const variants = document.createElement("div");

            pair.className = "semantic-pair";
            pairTitle.textContent = `${pack.name}: ${semanticId}`;
            variants.className = "semantic-pair-variants";
            pair.append(pairTitle, variants);
            grid.append(pair);
            appendComponent(pack, record, "Border", variants, "auto");
            appendComponent(pack, record, "No border", variants, "none");
          }
        }
      } else if (view === "comparison") {
        title.textContent = "Cross-pack semantic comparison";
        for (const record of packs[0].coreIcons) {
          for (const pack of packs) {
            const packRecord = pack.coreIcons.find(({ id }) => id === record.id);

            appendComponent(pack, packRecord, `${record.id} - ${pack.name}`);
          }
        }
      } else if (view === "semantic") {
        title.textContent = `${iconId} across all packs`;
        for (const pack of packs) {
          const record = pack.coreIcons.find(({ id }) => id === iconId);

          if (record) {
            appendComponent(pack, record, pack.name);
          }
        }
      } else if (view === "paths") {
        const record =
          [...selectedPack.coreIcons, ...selectedPack.optionalIcons].find(
            ({ id }) => id === iconId
          ) ?? selectedPack.coreIcons[0];

        title.textContent = `${selectedPack.name}: ${record.id} consumption paths`;
        appendComponent(selectedPack, record, "Web component");
        await appendInline(selectedPack, record);
        appendSprite(selectedPack, record);
      } else {
        const records = [
          ...selectedPack.coreIcons,
          ...selectedPack.optionalIcons
        ];

        title.textContent = `${selectedPack.name}: ${records.length} icons`;
        for (const record of records) {
          appendComponent(selectedPack, record);
        }
      }

      await Promise.all(pending);
      await document.fonts.ready;
      await new Promise((resolve) =>
        requestAnimationFrame(() => requestAnimationFrame(resolve))
      );
      document.body.dataset.ready = "true";
    </script>
  </body>
</html>
