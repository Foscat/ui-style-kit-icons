<svg overflow="visible" class="cp-icon" xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-labelledby="chart-title chart-desc">
  <title id="chart-title">Chart</title>
  <desc id="chart-desc">Theme-aware cyberpunk SVG icon with gritty neon HUD styling and UI Style Kit color variables. Semantic meaning: Analytics, reports, graph.</desc>
  <style>
/* Cyberpunk standardized icon layer */
.cp-icon, [data-cp-icon]{
  --cp-icon-size: 1.25em;
  --cp-icon-bg: rgb(var(--usk-surface-rgb, 8 12 24) / .9);
  --cp-icon-bg-strong: rgb(var(--usk-surface-strong-rgb, 20 28 48) / .94);
  --cp-icon-bg-soft: rgb(var(--usk-surface-soft-rgb, 26 35 58) / .68);
  --cp-icon-border: rgb(var(--usk-border-rgb, 100 116 139) / .72);
  --cp-icon-primary: rgb(var(--usk-primary-rgb, 80 160 255));
  --cp-icon-secondary: rgb(var(--usk-secondary-rgb, 138 116 255));
  --cp-icon-accent: rgb(var(--usk-accent-rgb, 255 170 76));
  --cp-icon-success: rgb(var(--usk-success-rgb, 74 222 128));
  --cp-icon-warning: rgb(var(--usk-warning-rgb, 255 200 80));
  --cp-icon-danger: rgb(var(--usk-danger-rgb, 255 92 122));
  --cp-icon-muted: rgb(var(--usk-text-muted-rgb, 148 163 184));
  inline-size: var(--usk-icon-size, var(--cp-icon-size));
  block-size: var(--usk-icon-size, var(--cp-icon-size));
  display: inline-block;
  vertical-align: -0.125em;
  overflow: visible;
}
.cp-icon--xs{ --cp-icon-size: 1em; }
.cp-icon--sm{ --cp-icon-size: 1.25em; }
.cp-icon--md{ --cp-icon-size: 1.5em; }
.cp-icon--lg{ --cp-icon-size: 2em; }
.cp-icon--xl{ --cp-icon-size: 3em; }
.cp-i-bg{ fill: var(--cp-icon-bg); }
.cp-i-bg-strong{ fill: var(--cp-icon-bg-strong); }
.cp-i-bg-soft{ fill: var(--cp-icon-bg-soft); }
.cp-i-primary{ fill: rgb(var(--usk-primary-rgb, 80 160 255) / .2); stroke: var(--cp-icon-primary); }
.cp-i-secondary{ fill: rgb(var(--usk-secondary-rgb, 138 116 255) / .2); stroke: var(--cp-icon-secondary); }
.cp-i-accent{ fill: rgb(var(--usk-accent-rgb, 255 170 76) / .22); stroke: var(--cp-icon-accent); }
.cp-i-success{ fill: rgb(var(--usk-success-rgb, 74 222 128) / .2); stroke: var(--cp-icon-success); }
.cp-i-warning{ fill: rgb(var(--usk-warning-rgb, 255 200 80) / .22); stroke: var(--cp-icon-warning); }
.cp-i-danger{ fill: rgb(var(--usk-danger-rgb, 255 92 122) / .2); stroke: var(--cp-icon-danger); }
.cp-i-line{ fill: none; stroke: var(--cp-icon-primary); stroke-width: 6.5; stroke-linecap: round; stroke-linejoin: round; }
.cp-i-line-2{ fill: none; stroke: var(--cp-icon-secondary); stroke-width: 4.7; stroke-linecap: round; stroke-linejoin: round; }
.cp-i-line-3{ fill: none; stroke: var(--cp-icon-accent); stroke-width: 3.8; stroke-linecap: round; stroke-linejoin: round; }
.cp-i-muted{ fill: none; stroke: var(--cp-icon-muted); stroke-width: 2.8; stroke-linecap: round; stroke-linejoin: round; }
.cp-i-surface{ fill: var(--cp-icon-bg); stroke: var(--cp-icon-border); stroke-width: 4.5; }

[data-icon-frame]{opacity:var(--usk-icon-frame-opacity,1)}
[data-icon-frame="decor"]{opacity:var(--usk-icon-frame-decor-opacity,.26)}
[data-icon-glyph="play"]{fill:var(--usk-icon-play,var(--usk-icon-foreground,rgb(var(--usk-text-rgb,255 255 255))));stroke:none;opacity:1}
</style>
<defs>
    <linearGradient id="chart-bg" x1="24" y1="18" x2="236" y2="238" gradientUnits="userSpaceOnUse">
      <stop stop-color="rgb(var(--usk-surface-strong-rgb, 15 36 68))"/>
      <stop offset=".45" stop-color="rgb(var(--usk-surface-rgb, 7 17 38))"/>
      <stop offset="1" stop-color="rgb(var(--usk-bg-rgb, 3 6 17))"/>
    </linearGradient>
    <linearGradient id="chart-panel" x1="54" y1="46" x2="204" y2="206" gradientUnits="userSpaceOnUse">
      <stop stop-color="var(--cp-icon-primary, rgb(var(--usk-primary-rgb, 88 244 255)))" stop-opacity=".96"/>
      <stop offset=".3" stop-color="var(--cp-icon-primary, rgb(var(--usk-primary-rgb, 31 183 255)))" stop-opacity=".9"/>
      <stop offset=".62" stop-color="var(--cp-icon-secondary, rgb(var(--usk-secondary-rgb, 181 22 255)))" stop-opacity=".9"/>
      <stop offset="1" stop-color="var(--cp-icon-secondary, rgb(var(--usk-secondary-rgb, 255 46 159)))" stop-opacity=".98"/>
    </linearGradient>
    <linearGradient id="chart-hot" x1="58" y1="48" x2="198" y2="208" gradientUnits="userSpaceOnUse">
      <stop stop-color="var(--cp-icon-accent, rgb(var(--usk-accent-rgb, 255 184 77)))"/>
      <stop offset=".45" stop-color="var(--cp-icon-secondary, rgb(var(--usk-secondary-rgb, 255 46 159)))"/>
      <stop offset="1" stop-color="var(--cp-icon-primary, rgb(var(--usk-primary-rgb, 88 244 255)))"/>
    </linearGradient>
    <filter id="chart-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4.2" result="blur"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="chart-clip"><rect x="18" y="18" width="220" height="220" rx="28"/></clipPath>
  </defs>

    <path data-icon-frame="surface" d="M42 18H214L238 42V214L214 238H42L18 214V42Z" fill="url(#chart-bg)"/>
    <g data-icon-frame="decor" clip-path="url(#chart-clip)" opacity=".65">
      <path fill="none" data-icon-frame="decor" d="M28 74H60M196 74H228M28 182H60M196 182H228M74 28V56M182 28V56M74 200V228M182 200V228" stroke="var(--cp-icon-primary, rgb(var(--usk-primary-rgb, 88 244 255)))" stroke-width="2"/>
      <path fill="none" data-icon-frame="decor" d="M22 102H48M208 102H236M42 218H88M168 218H214" stroke="var(--cp-icon-secondary, rgb(var(--usk-secondary-rgb, 255 46 159)))" stroke-width="2"/>

      <path fill="none" data-icon-frame="decor" d="M30 52H70M80 52H88M98 52H112M144 52H182M194 52H204M40 216H66M76 216H114M146 216H180M190 216H214" stroke="var(--cp-icon-muted, rgb(var(--usk-text-muted-rgb, 111 143 184)))" stroke-width="2"/>
    </g>
    <path data-icon-frame="surface" d="M42 18H214L238 42V214L214 238H42L18 214V42Z" fill="none" stroke="url(#chart-panel)" stroke-width="4"/>
    <path fill="none" data-icon-frame="decor" d="M52 32H98M158 32H204M32 52V98M224 156V204M54 224H104M154 224H204" stroke="currentColor" stroke-width="3" opacity=".78"/>


<g clip-path="url(#chart-clip)">
                    <path fill="none" d="M66 188H196" stroke="var(--cp-icon-accent, rgb(var(--usk-accent-rgb, 255 184 77)))" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><rect x="78" y="132" width="23" height="56" rx="5" fill="var(--cp-icon-primary, rgb(var(--usk-primary-rgb, 88 244 255)))" filter="url(#chart-glow)"/><rect x="116" y="101" width="23" height="87" rx="5" fill="var(--cp-icon-secondary, rgb(var(--usk-secondary-rgb, 255 46 159)))"/><rect x="154" y="72" width="23" height="116" rx="5" fill="var(--cp-icon-success, #b8ff5c)"/><path d="M72 110L107 126L139 90L183 68" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
                    <path fill="none" data-icon-frame="decor" d="M40 198H72M82 198H98M158 198H216" stroke="var(--cp-icon-primary, rgb(var(--usk-primary-rgb, 88 244 255)))" stroke-width="3" opacity=".45"/>
                    <path fill="none" data-icon-frame="decor" d="M40 208H126M138 208H152M166 208H216" stroke="var(--cp-icon-secondary, rgb(var(--usk-secondary-rgb, 255 46 159)))" stroke-width="2" opacity=".4"/>
                  </g>

</svg>
