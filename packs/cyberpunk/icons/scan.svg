<svg overflow="visible" class="cp-icon" xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-labelledby="scan-title scan-desc">
  <title id="scan-title">Scan</title>
  <desc id="scan-desc">Theme-aware cyberpunk SVG icon with gritty neon HUD styling and UI Style Kit color variables. Semantic meaning: Scan, detect, verify, focus target.</desc>
  <style>
[data-icon-frame]{opacity:var(--usk-icon-frame-opacity,1)}
[data-icon-frame="decor"]{opacity:var(--usk-icon-frame-decor-opacity,var(--usk-icon-frame-opacity,1))}
[data-icon-glyph="play"]{fill:var(--usk-icon-play,var(--usk-icon-foreground,rgb(var(--usk-text-rgb,255 255 255))));stroke:none;opacity:1}
</style>
  
  <defs>
    <linearGradient id="scan-bg" x1="24" y1="18" x2="236" y2="238" gradientUnits="userSpaceOnUse">
      <stop stop-color="rgb(var(--usk-surface-strong-rgb, 15 36 68))"/>
      <stop offset=".45" stop-color="rgb(var(--usk-surface-rgb, 7 17 38))"/>
      <stop offset="1" stop-color="rgb(var(--usk-bg-rgb, 3 6 17))"/>
    </linearGradient>
    <linearGradient id="scan-panel" x1="54" y1="46" x2="204" y2="206" gradientUnits="userSpaceOnUse">
      <stop stop-color="rgb(var(--usk-primary-rgb, 88 244 255))" stop-opacity=".96"/>
      <stop offset=".3" stop-color="rgb(var(--usk-primary-rgb, 31 183 255))" stop-opacity=".9"/>
      <stop offset=".62" stop-color="rgb(var(--usk-secondary-rgb, 181 22 255))" stop-opacity=".9"/>
      <stop offset="1" stop-color="rgb(var(--usk-secondary-rgb, 255 46 159))" stop-opacity=".98"/>
    </linearGradient>
    <linearGradient id="scan-hot" x1="58" y1="48" x2="198" y2="208" gradientUnits="userSpaceOnUse">
      <stop stop-color="rgb(var(--usk-accent-rgb, 255 184 77))"/>
      <stop offset=".45" stop-color="rgb(var(--usk-secondary-rgb, 255 46 159))"/>
      <stop offset="1" stop-color="rgb(var(--usk-primary-rgb, 88 244 255))"/>
    </linearGradient>
    <filter id="scan-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4.2" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.18  0 1 0 0 0.85  0 0 1 0 1  0 0 0 .9 0"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="scan-clip"><rect x="18" y="18" width="220" height="220" rx="28"/></clipPath>
  </defs>
  
    <path data-icon-frame="decor" d="M42 18H214L238 42V214L214 238H42L18 214V42Z" fill="url(#scan-bg)"/>
    <g data-icon-frame="decor" clip-path="url(#scan-clip)" opacity=".65">
