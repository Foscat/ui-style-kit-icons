<svg overflow="visible" xmlns="http://www.w3.org/2000/svg" class="cp-icon" width="256" height="256" viewBox="0 0 256 256" role="img" aria-labelledby="tile-title tile-desc">
  <title id="tile-title">Tile</title>
  <desc id="tile-desc">Theme-aware cyberpunk SVG icon with gritty neon HUD styling and UI Style Kit color variables. Semantic meaning: Bento tile, card tile, app block.</desc>
  <style>
/* Cyberpunk standardized icon layer */
.cp-icon, [data-cp-icon]{
  --cp-icon-size: 1.25em;
  --cp-icon-bg: rgb(var(--usk-surface-rgb, 8 12 24) / .9);
  --cp-icon-bg-strong: rgb(var(--usk-surface-strong-rgb, 20 28 48) / .94);
  --cp-icon-bg-soft: rgb(var(--usk-surface-soft-rgb, 26 35 58) / .68);
  --cp-icon-border: rgb(var(--usk-border-rgb, 100 116 139) / .72);
  --cp-icon-primary: rgb(var(--usk-primary-rgb, 80 160 255));
  --cp-icon-secondary: rgb(var(--usk-secondary-rgb, 138 116 255));
  --cp-icon-accent: rgb(var(--usk-accent-rgb, 255 170 76));
  --cp-icon-success: rgb(var(--usk-success-rgb, 74 222 128));
  --cp-icon-warning: rgb(var(--usk-warning-rgb, 255 200 80));
  --cp-icon-danger: rgb(var(--usk-danger-rgb, 255 92 122));
  --cp-icon-muted: rgb(var(--usk-text-muted-rgb, 148 163 184));
  inline-size: var(--usk-icon-size, var(--cp-icon-size));
  block-size: var(--usk-icon-size, var(--cp-icon-size));
  display: inline-block;
  vertical-align: -0.125em;
  overflow: visible;
}
.cp-icon--xs{ --cp-icon-size: 1em; }
.cp-icon--sm{ --cp-icon-size: 1.25em; }
.cp-icon--md{ --cp-icon-size: 1.5em; }
.cp-icon--lg{ --cp-icon-size: 2em; }
.cp-icon--xl{ --cp-icon-size: 3em; }
.cp-i-bg{ fill: var(--cp-icon-bg); }
.cp-i-bg-strong{ fill: var(--cp-icon-bg-strong); }
.cp-i-bg-soft{ fill: var(--cp-icon-bg-soft); }
.cp-i-primary{ fill: rgb(var(--usk-primary-rgb, 80 160 255) / .2); stroke: var(--cp-icon-primary); }
.cp-i-secondary{ fill: rgb(var(--usk-secondary-rgb, 138 116 255) / .2); stroke: var(--cp-icon-secondary); }
.cp-i-accent{ fill: rgb(var(--usk-accent-rgb, 255 170 76) / .22); stroke: var(--cp-icon-accent); }
.cp-i-success{ fill: rgb(var(--usk-success-rgb, 74 222 128) / .2); stroke: var(--cp-icon-success); }
.cp-i-warning{ fill: rgb(var(--usk-warning-rgb, 255 200 80) / .22); stroke: var(--cp-icon-warning); }
.cp-i-danger{ fill: rgb(var(--usk-danger-rgb, 255 92 122) / .2); stroke: var(--cp-icon-danger); }
.cp-i-line{ fill: none; stroke: var(--cp-icon-primary); stroke-width: 6.5; stroke-linecap: round; stroke-linejoin: round; }
.cp-i-line-2{ fill: none; stroke: var(--cp-icon-secondary); stroke-width: 4.7; stroke-linecap: round; stroke-linejoin: round; }
.cp-i-line-3{ fill: none; stroke: var(--cp-icon-accent); stroke-width: 3.8; stroke-linecap: round; stroke-linejoin: round; }
.cp-i-muted{ fill: none; stroke: var(--cp-icon-muted); stroke-width: 2.8; stroke-linecap: round; stroke-linejoin: round; }
.cp-i-surface{ fill: var(--cp-icon-bg); stroke: var(--cp-icon-border); stroke-width: 4.5; }

[data-icon-frame]{opacity:var(--usk-icon-frame-opacity,1)}
[data-icon-frame="decor"]{opacity:var(--usk-icon-frame-decor-opacity,.26)}
[data-icon-glyph="play"]{fill:var(--usk-icon-play,var(--usk-icon-foreground,rgb(var(--usk-text-rgb,255 255 255))));stroke:none;opacity:1}
</style>
<path data-icon-frame="surface" class="cp-i-bg-strong" d="M42 20H214L236 42V214L214 236H42L20 214V42Z"/><g data-icon-frame="decor" opacity=".65"><path data-icon-frame="decor" fill="none" d="M28 74H60M196 74H228M28 182H60M196 182H228M74 28V56M182 28V56M74 200V228M182 200V228" stroke="var(--cp-icon-primary, rgb(var(--usk-primary-rgb, 88 244 255)))" stroke-width="2"/><path data-icon-frame="decor" fill="none" d="M22 102H48M208 102H236M42 218H88M168 218H214" stroke="var(--cp-icon-secondary, rgb(var(--usk-secondary-rgb, 255 46 159)))" stroke-width="2"/><path data-icon-frame="decor" fill="none" d="M30 52H70M80 52H88M98 52H112M144 52H182M194 52H204M40 216H66M76 216H114M146 216H180M190 216H214" stroke="var(--cp-icon-muted, rgb(var(--usk-text-muted-rgb, 111 143 184)))" stroke-width="2"/></g><path data-icon-frame="surface" fill="none" d="M42 20H214L236 42V214L214 236H42L20 214V42Z" stroke="currentColor" stroke-width="4" opacity=".78"/><path data-icon-frame="decor" fill="none" d="M52 34H98M158 34H204M34 52V98M222 156V204M54 222H104M154 222H204" stroke="currentColor" stroke-width="3" opacity=".78"/>


<rect class="cp-i-primary" x="58" y="72" width="64" height="64" rx="20"/>
<rect class="cp-i-secondary" x="136" y="72" width="62" height="38" rx="14"/>
<rect class="cp-i-accent" x="58" y="150" width="96" height="42" rx="16"/>
<rect class="cp-i-bg-strong" x="168" y="126" width="30" height="66" rx="12"/>

</svg>
