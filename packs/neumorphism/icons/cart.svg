<svg overflow="visible" xmlns="http://www.w3.org/2000/svg" class="neo-icon" width="256" height="256" viewBox="0 0 256 256" role="img" aria-labelledby="cart-title cart-desc">
  <title id="cart-title">Cart</title>
  <desc id="cart-desc">Theme-aware Neumorphism SVG icon with soft extruded surfaces, dual light and dark shadows, inset grooves, and UI Style Kit color variables. Semantic meaning: Checkout cart, purchase flow.</desc>
  <style>
.neo-i-bg{fill:var(--neo-icon-bg,rgb(var(--usk-surface-rgb,232 238 245)/.96))}
