<svg overflow="hidden" xmlns="http://www.w3.org/2000/svg" class="y2k-icon" width="256" height="256" viewBox="0 0 256 256" role="img" aria-labelledby="cloud-title cloud-desc">
  <title id="cloud-title">Cloud</title>
  <desc id="cloud-desc">Theme-aware Y2K SVG icon with glossy jelly styling and UI Style Kit color variables. Semantic meaning: Cloud sync, hosted storage.</desc>
  <style>
