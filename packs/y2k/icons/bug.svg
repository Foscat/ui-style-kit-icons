    <path data-icon-part="bug-legs" class="y2k-i-line-2" d="M92 112L63 96M88 136H55M92 160L63 178M164 112L193 96M168 136H201M164 160L193 178M108 80L90 57M148 80L166 57"/>
    <path data-icon-part="bug-body" class="y2k-i-line" d="M90 128C90 98 106 82 128 82C150 82 166 98 166 128V151C166 182 150 202 128 202C106 202 90 182 90 151Z"/>
