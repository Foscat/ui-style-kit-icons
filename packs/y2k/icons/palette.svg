.y2k-i-primary{fill:var(--y2k-icon-primary,rgb(var(--usk-primary-rgb,55 160 255)));stroke:var(--y2k-icon-primary,rgb(var(--usk-primary-rgb,55 160 255)))}
.y2k-i-secondary{fill:var(--y2k-icon-secondary,rgb(var(--usk-secondary-rgb,255 96 190)));stroke:var(--y2k-icon-secondary,rgb(var(--usk-secondary-rgb,255 96 190)))}
