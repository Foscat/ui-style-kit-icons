.y2k-i-shine{fill:none;stroke:var(--y2k-icon-gloss,rgb(255 255 255/.78));stroke-width:7;stroke-linecap:round}
.y2k-i-line{fill:none;stroke:var(--y2k-icon-primary,rgb(var(--usk-primary-rgb,55 160 255)));stroke-width:7;stroke-linecap:round;stroke-linejoin:round}
.y2k-i-line-2{fill:none;stroke:var(--y2k-icon-secondary,rgb(var(--usk-secondary-rgb,255 96 190)));stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
