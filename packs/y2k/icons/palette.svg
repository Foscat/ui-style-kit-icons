.y2k-i-surface{fill:var(--y2k-icon-bg,rgb(var(--usk-surface-rgb,248 246 255)/.84));stroke:var(--y2k-icon-border,rgb(var(--usk-border-rgb,176 191 228)/.72));stroke-width:5}
