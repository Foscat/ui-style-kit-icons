<svg overflow="hidden" xmlns="http://www.w3.org/2000/svg" class="y2k-icon" width="256" height="256" viewBox="0 0 256 256" role="img" aria-labelledby="palette-title palette-desc">
  <title id="palette-title">Palette</title>
  <desc id="palette-desc">Theme-aware Y2K SVG icon with glossy jelly styling and UI Style Kit color variables. Semantic meaning: Theme, color, visual style.</desc>
  <style>
.y2k-i-bg{fill:var(--y2k-icon-bg,rgb(var(--usk-surface-rgb,248 246 255)/.84))}
