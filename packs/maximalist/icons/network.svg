    <circle data-icon-part="network-node" class="max-i-secondary" cx="128" cy="72" r="19" style="fill:var(--max-icon-secondary,rgb(var(--usk-secondary-rgb,57 222 255)));stroke:var(--max-icon-border,rgb(var(--usk-border-rgb,22 18 35)/.94));stroke-width:6"/>
    <circle data-icon-part="network-node" class="max-i-accent" cx="184" cy="130" r="19" style="fill:var(--max-icon-accent,rgb(var(--usk-accent-rgb,255 203 43)));stroke:var(--max-icon-border,rgb(var(--usk-border-rgb,22 18 35)/.94));stroke-width:6"/>
    <circle data-icon-part="network-node" class="max-i-success" cx="128" cy="188" r="19" style="fill:var(--max-icon-success,rgb(var(--usk-success-rgb,22 201 121)));stroke:var(--max-icon-border,rgb(var(--usk-border-rgb,22 18 35)/.94));stroke-width:6"/>
