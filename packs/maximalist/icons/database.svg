<svg overflow="visible" xmlns="http://www.w3.org/2000/svg" class="max-icon" width="256" height="256" viewBox="0 0 256 256" role="img" aria-labelledby="database-title database-desc">
  <title id="database-title">Database</title>
  <desc id="database-desc">Theme-aware Maximalist / Playful SVG icon with chunky sticker styling, loud token colors, and UI Style Kit color variables. Semantic meaning: Persistent data store.</desc>
  <style>
