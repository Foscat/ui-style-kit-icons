<svg overflow="visible" xmlns="http://www.w3.org/2000/svg" class="max-icon" width="256" height="256" viewBox="0 0 256 256" role="img" aria-labelledby="link-title link-desc">
  <title id="link-title">Link</title>
  <desc id="link-desc">Theme-aware Maximalist / Playful SVG icon with chunky sticker styling, loud token colors, and UI Style Kit color variables. Semantic meaning: URL, connection, relationship.</desc>
  <style>
.max-i-bg{fill:var(--max-icon-bg,rgb(var(--usk-surface-rgb,255 247 232)/.98))}
.max-i-bg-strong{fill:var(--max-icon-bg-strong,rgb(var(--usk-surface-strong-rgb,255 255 255)/1))}
.max-i-bg-soft{fill:var(--max-icon-bg-soft,rgb(var(--usk-surface-soft-rgb,255 223 245)/.92))}
.max-i-primary{fill:var(--max-icon-primary-soft,rgb(var(--usk-primary-rgb,255 77 141)/.28));stroke:var(--max-icon-primary,rgb(var(--usk-primary-rgb,255 77 141)))}
.max-i-secondary{fill:var(--max-icon-secondary-soft,rgb(var(--usk-secondary-rgb,57 222 255)/.26));stroke:var(--max-icon-secondary,rgb(var(--usk-secondary-rgb,57 222 255)))}
.max-i-accent{fill:var(--max-icon-accent-soft,rgb(var(--usk-accent-rgb,255 203 43)/.32));stroke:var(--max-icon-accent,rgb(var(--usk-accent-rgb,255 203 43)))}
.max-i-success{fill:rgb(var(--usk-success-rgb,22 201 121)/.26);stroke:var(--max-icon-success,rgb(var(--usk-success-rgb,22 201 121)))}
.max-i-warning{fill:rgb(var(--usk-warning-rgb,255 171 37)/.3);stroke:var(--max-icon-warning,rgb(var(--usk-warning-rgb,255 171 37)))}
.max-i-danger{fill:rgb(var(--usk-danger-rgb,255 59 92)/.26);stroke:var(--max-icon-danger,rgb(var(--usk-danger-rgb,255 59 92)))}
.max-i-line{fill:none;stroke:var(--max-icon-primary,rgb(var(--usk-primary-rgb,255 77 141)));stroke-width:8.6;stroke-linecap:round;stroke-linejoin:round}
.max-i-line-2{fill:none;stroke:var(--max-icon-secondary,rgb(var(--usk-secondary-rgb,57 222 255)));stroke-width:6.4;stroke-linecap:round;stroke-linejoin:round}
.max-i-line-3{fill:none;stroke:var(--max-icon-accent,rgb(var(--usk-accent-rgb,255 203 43)));stroke-width:5.4;stroke-linecap:round;stroke-linejoin:round}
.max-i-muted{fill:none;stroke:var(--max-icon-muted,rgb(var(--usk-text-muted-rgb,71 57 96)));stroke-width:3.8;stroke-linecap:round;stroke-linejoin:round}
.max-i-fill-muted{fill:var(--max-icon-muted,rgb(var(--usk-text-muted-rgb,71 57 96)));stroke:none}
.max-i-surface{fill:var(--max-icon-bg,rgb(var(--usk-surface-rgb,255 247 232)/.98));stroke:var(--max-icon-border,rgb(var(--usk-border-rgb,22 18 35)/.94));stroke-width:6.4}
.max-i-shadow{fill:var(--max-icon-shadow,rgb(var(--usk-border-rgb,22 18 35)/.8));stroke:none}
.max-i-confetti{fill:var(--max-icon-accent,rgb(var(--usk-accent-rgb,255 203 43)));stroke:var(--max-icon-border,rgb(var(--usk-border-rgb,22 18 35)/.94));stroke-width:3.2}
.max-i-pop{fill:var(--max-icon-secondary,rgb(var(--usk-secondary-rgb,57 222 255)));stroke:var(--max-icon-border,rgb(var(--usk-border-rgb,22 18 35)/.94));stroke-width:3.2}
.max-i-glow{filter:drop-shadow(0 0 8px rgb(var(--usk-primary-rgb,255 77 141)/.38))}
[data-icon-frame]{opacity:var(--usk-icon-frame-opacity,1)}
[data-icon-frame="decor"]{opacity:var(--usk-icon-frame-decor-opacity,var(--usk-icon-frame-opacity,1))}
[data-icon-glyph="play"]{fill:var(--usk-icon-play,var(--usk-icon-foreground,rgb(var(--usk-text-rgb,255 255 255))));stroke:none;opacity:1}
</style>
  <rect data-icon-frame="surface" class="max-i-shadow" x="38" y="38" width="194" height="194" rx="48"/>
  <rect data-icon-frame="surface" class="max-i-surface" x="24" y="24" width="198" height="198" rx="48"/>
  <circle data-icon-frame="decor" class="max-i-confetti" cx="48" cy="48" r="7"/>
  <rect data-icon-frame="decor" class="max-i-pop" x="184" y="196" width="24" height="14" rx="7" transform="rotate(12 196 203)"/>
  <g data-icon-glyph="semantic" data-icon-prototype="reference-led-v1" transform="rotate(-32 128 128)">
    <rect data-icon-part="link-loop-a" class="max-i-primary" x="48" y="87" width="108" height="68" rx="30" style="fill:var(--max-icon-primary,rgb(var(--usk-primary-rgb,255 77 141)));stroke:var(--max-icon-border,rgb(var(--usk-border-rgb,22 18 35)/.94));stroke-width:7"/>
    <rect data-icon-part="link-cutout-a" class="max-i-bg-strong" x="66" y="104" width="72" height="34" rx="16" style="stroke:var(--max-icon-border,rgb(var(--usk-border-rgb,22 18 35)/.94));stroke-width:4"/>
    <rect data-icon-part="link-loop-b" class="max-i-secondary" x="100" y="103" width="108" height="68" rx="30" style="fill:var(--max-icon-secondary,rgb(var(--usk-secondary-rgb,57 222 255)));stroke:var(--max-icon-border,rgb(var(--usk-border-rgb,22 18 35)/.94));stroke-width:7"/>
    <rect data-icon-part="link-cutout-b" class="max-i-bg-strong" x="118" y="120" width="72" height="34" rx="16" style="stroke:var(--max-icon-border,rgb(var(--usk-border-rgb,22 18 35)/.94));stroke-width:4"/>
    <path data-icon-part="link-bridge" class="max-i-accent" d="M107 114C119 108 137 113 149 126L139 143C131 136 123 133 115 138Z" style="fill:var(--max-icon-accent,rgb(var(--usk-accent-rgb,255 203 43)));stroke:var(--max-icon-border,rgb(var(--usk-border-rgb,22 18 35)/.94));stroke-width:5;stroke-linejoin:round"/>
  </g>
</svg>
