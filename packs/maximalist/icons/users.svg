  <rect data-icon-frame="decor" class="max-i-pop" x="184" y="196" width="24" height="14" rx="7" transform="rotate(12 196 203)"/>
  <g data-icon-glyph="semantic" data-icon-prototype="reference-led-v1">
    <path data-icon-part="users-shoulders" class="max-i-secondary" d="M49 183C53 154 65 138 82 138C95 138 104 146 111 160L104 183Z" style="fill:var(--max-icon-secondary,rgb(var(--usk-secondary-rgb,57 222 255)));stroke:var(--max-icon-border,rgb(var(--usk-border-rgb,22 18 35)/.94));stroke-width:6;stroke-linejoin:round"/>
    <path data-icon-part="users-shoulders" class="max-i-primary" d="M88 192C90 154 105 132 128 132C151 132 166 154 168 192Z" style="fill:var(--max-icon-primary,rgb(var(--usk-primary-rgb,255 77 141)));stroke:var(--max-icon-border,rgb(var(--usk-border-rgb,22 18 35)/.94));stroke-width:7;stroke-linejoin:round"/>
    <path data-icon-part="users-shoulders" class="max-i-accent" d="M145 160C152 146 161 138 174 138C191 138 203 154 207 183H152Z" style="fill:var(--max-icon-accent,rgb(var(--usk-accent-rgb,255 203 43)));stroke:var(--max-icon-border,rgb(var(--usk-border-rgb,22 18 35)/.94));stroke-width:6;stroke-linejoin:round"/>
    <circle data-icon-part="users-head" class="max-i-secondary" cx="82" cy="111" r="16" style="fill:var(--max-icon-secondary,rgb(var(--usk-secondary-rgb,57 222 255)));stroke:var(--max-icon-border,rgb(var(--usk-border-rgb,22 18 35)/.94));stroke-width:6"/>
    <circle data-icon-part="users-head" class="max-i-primary" cx="128" cy="91" r="20" style="fill:var(--max-icon-primary,rgb(var(--usk-primary-rgb,255 77 141)));stroke:var(--max-icon-border,rgb(var(--usk-border-rgb,22 18 35)/.94));stroke-width:7"/>
    <circle data-icon-part="users-head" class="max-i-accent" cx="174" cy="111" r="16" style="fill:var(--max-icon-accent,rgb(var(--usk-accent-rgb,255 203 43)));stroke:var(--max-icon-border,rgb(var(--usk-border-rgb,22 18 35)/.94));stroke-width:6"/>
    <path data-icon-part="users-highlight" class="max-i-success" d="M110 88C113 75 122 69 133 71C141 73 147 80 148 91L138 84L130 91L121 83Z" style="fill:var(--max-icon-success,rgb(var(--usk-success-rgb,22 201 121)));stroke:var(--max-icon-border,rgb(var(--usk-border-rgb,22 18 35)/.94));stroke-width:4;stroke-linejoin:round"/>
  </g>
