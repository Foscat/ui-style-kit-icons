    <path data-icon-part="megaphone-sound" class="max-i-warning" d="M181 111C191 115 196 121 196 128C196 135 191 141 181 145L178 134C182 132 184 130 184 128C184 126 182 124 178 122Z" style="fill:var(--max-icon-warning,rgb(var(--usk-warning-rgb,255 171 37)));stroke:var(--max-icon-border,rgb(var(--usk-border-rgb,22 18 35)/.94));stroke-width:4;stroke-linejoin:round"/>
