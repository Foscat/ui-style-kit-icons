<svg overflow="visible" xmlns="http://www.w3.org/2000/svg" class="max-icon" width="256" height="256" viewBox="-8 -8 272 272" role="img" aria-labelledby="palette-title palette-desc">
  <title id="palette-title">Palette</title>
