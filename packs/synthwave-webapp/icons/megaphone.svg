<svg overflow="visible" xmlns="http://www.w3.org/2000/svg" class="sw-icon" width="256" height="256" viewBox="0 0 256 256" role="img" aria-labelledby="megaphone-title megaphone-desc">
  <title id="megaphone-title">Megaphone</title>
  <desc id="megaphone-desc">Theme-aware synthwave web application SVG icon with neon styling and UI Style Kit color variables. Semantic meaning: Announcement, marketing, broadcast.</desc>
  <style>
/* Synthwave Web App standardized icon layer */
.sw-icon, [data-sw-icon]{
  --sw-icon-size: 1.25em;
  --sw-icon-bg: rgb(var(--usk-surface-rgb, 8 12 24) / .9);
  --sw-icon-bg-strong: rgb(var(--usk-surface-strong-rgb, 20 28 48) / .94);
  --sw-icon-bg-soft: rgb(var(--usk-surface-soft-rgb, 26 35 58) / .68);
  --sw-icon-border: rgb(var(--usk-border-rgb, 100 116 139) / .72);
  --sw-icon-primary: rgb(var(--usk-primary-rgb, 80 160 255));
  --sw-icon-secondary: rgb(var(--usk-secondary-rgb, 138 116 255));
  --sw-icon-accent: rgb(var(--usk-accent-rgb, 255 170 76));
  --sw-icon-success: rgb(var(--usk-success-rgb, 74 222 128));
  --sw-icon-warning: rgb(var(--usk-warning-rgb, 255 200 80));
  --sw-icon-danger: rgb(var(--usk-danger-rgb, 255 92 122));
  --sw-icon-muted: rgb(var(--usk-text-muted-rgb, 148 163 184));
  inline-size: var(--usk-icon-size, var(--sw-icon-size));
  block-size: var(--usk-icon-size, var(--sw-icon-size));
  display: inline-block;
  vertical-align: -0.125em;
  overflow: visible;
}
.sw-icon--xs{ --sw-icon-size: 1em; }
.sw-icon--sm{ --sw-icon-size: 1.25em; }
.sw-icon--md{ --sw-icon-size: 1.5em; }
.sw-icon--lg{ --sw-icon-size: 2em; }
.sw-icon--xl{ --sw-icon-size: 3em; }
.sw-i-bg{ fill: var(--sw-icon-bg); }
.sw-i-bg-strong{ fill: var(--sw-icon-bg-strong); }
.sw-i-bg-soft{ fill: var(--sw-icon-bg-soft); }
.sw-i-primary{ fill: rgb(var(--usk-primary-rgb, 80 160 255) / .2); stroke: var(--sw-icon-primary); }
.sw-i-secondary{ fill: rgb(var(--usk-secondary-rgb, 138 116 255) / .2); stroke: var(--sw-icon-secondary); }
.sw-i-accent{ fill: rgb(var(--usk-accent-rgb, 255 170 76) / .22); stroke: var(--sw-icon-accent); }
.sw-i-success{ fill: rgb(var(--usk-success-rgb, 74 222 128) / .2); stroke: var(--sw-icon-success); }
.sw-i-warning{ fill: rgb(var(--usk-warning-rgb, 255 200 80) / .22); stroke: var(--sw-icon-warning); }
.sw-i-danger{ fill: rgb(var(--usk-danger-rgb, 255 92 122) / .2); stroke: var(--sw-icon-danger); }
.sw-i-line{ fill: none; stroke: var(--sw-icon-primary); stroke-width: 6.5; stroke-linecap: round; stroke-linejoin: round; }
.sw-i-line-2{ fill: none; stroke: var(--sw-icon-secondary); stroke-width: 4.7; stroke-linecap: round; stroke-linejoin: round; }
.sw-i-line-3{ fill: none; stroke: var(--sw-icon-accent); stroke-width: 3.8; stroke-linecap: round; stroke-linejoin: round; }
.sw-i-muted{ fill: none; stroke: var(--sw-icon-muted); stroke-width: 2.8; stroke-linecap: round; stroke-linejoin: round; }
.sw-i-surface{ fill: var(--sw-icon-bg); stroke: var(--sw-icon-border); stroke-width: 4.5; }

[data-icon-frame]{opacity:var(--usk-icon-frame-opacity,1)}
[data-icon-frame="decor"]{opacity:var(--usk-icon-frame-decor-opacity,.18)}
[data-icon-glyph="play"]{fill:var(--usk-icon-play,var(--usk-icon-foreground,rgb(var(--usk-text-rgb,255 255 255))));stroke:none;opacity:1}
</style>
  <defs>
    <linearGradient id="swa-megaphone-split" x1="43" y1="72" x2="216" y2="195" gradientUnits="userSpaceOnUse">
      <stop stop-color="var(--sw-icon-primary)"/>
      <stop offset=".55" stop-color="var(--sw-icon-primary)"/>
      <stop offset=".56" stop-color="var(--sw-icon-secondary)"/>
      <stop offset="1" stop-color="var(--sw-icon-secondary)"/>
    </linearGradient>
  </defs>
  <rect data-icon-frame="surface" class="sw-i-surface" x="18" y="18" width="220" height="220" rx="48"/>
  <path data-icon-frame="decor" class="sw-i-line-3" d="M64 216H192" opacity=".68"/>
  <g data-icon-glyph="semantic" data-icon-prototype="reference-led-v1">
    <path data-icon-part="megaphone-horn" data-icon-webapp="body" d="M44 106H91L184 72V184L91 150H44Z" fill="var(--sw-icon-bg-strong)" stroke="url(#swa-megaphone-split)" stroke-width="8" stroke-linejoin="round"/>
    <path data-icon-part="megaphone-handle" d="M68 150L83 198H120L102 153Z" fill="var(--sw-icon-secondary)" stroke="var(--sw-icon-muted)" stroke-width="4" stroke-linejoin="round"/>
    <path data-icon-part="megaphone-horn" d="M91 106V150" fill="none" stroke="var(--sw-icon-accent)" stroke-width="5"/>
    <path data-icon-part="megaphone-sound" data-icon-webapp="status" d="M197 104Q215 128 197 152M189 117Q198 128 189 139" fill="none" stroke="var(--sw-icon-accent)" stroke-width="6" stroke-linecap="round"/>
    <rect data-icon-webapp="status" x="54" y="118" width="15" height="15" rx="4" fill="var(--sw-icon-success)"/>
  </g>
</svg>
