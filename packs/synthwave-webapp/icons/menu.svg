<svg overflow="visible" class="sw-icon" xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-labelledby="menu-title menu-desc">
  <title id="menu-title">Menu</title>
  <desc id="menu-desc">Theme-aware synthwave web application SVG icon with neon styling and UI Style Kit color variables. Semantic meaning: Navigation menu, list.</desc>
  <style>
/* Synthwave Web App standardized icon layer */
.sw-icon, [data-sw-icon]{
  --sw-icon-size: 1.25em;
  --sw-icon-bg: rgb(var(--usk-surface-rgb, 8 12 24) / .9);
  --sw-icon-bg-strong: rgb(var(--usk-surface-strong-rgb, 20 28 48) / .94);
  --sw-icon-bg-soft: rgb(var(--usk-surface-soft-rgb, 26 35 58) / .68);
  --sw-icon-border: rgb(var(--usk-border-rgb, 100 116 139) / .72);
  --sw-icon-primary: rgb(var(--usk-primary-rgb, 80 160 255));
  --sw-icon-secondary: rgb(var(--usk-secondary-rgb, 138 116 255));
  --sw-icon-accent: rgb(var(--usk-accent-rgb, 255 170 76));
  --sw-icon-success: rgb(var(--usk-success-rgb, 74 222 128));
  --sw-icon-warning: rgb(var(--usk-warning-rgb, 255 200 80));
  --sw-icon-danger: rgb(var(--usk-danger-rgb, 255 92 122));
  --sw-icon-muted: rgb(var(--usk-text-muted-rgb, 148 163 184));
  inline-size: var(--usk-icon-size, var(--sw-icon-size));
  block-size: var(--usk-icon-size, var(--sw-icon-size));
  display: inline-block;
  vertical-align: -0.125em;
  overflow: visible;
}
.sw-icon--xs{ --sw-icon-size: 1em; }
.sw-icon--sm{ --sw-icon-size: 1.25em; }
.sw-icon--md{ --sw-icon-size: 1.5em; }
.sw-icon--lg{ --sw-icon-size: 2em; }
.sw-icon--xl{ --sw-icon-size: 3em; }
.sw-i-bg{ fill: var(--sw-icon-bg); }
.sw-i-bg-strong{ fill: var(--sw-icon-bg-strong); }
.sw-i-bg-soft{ fill: var(--sw-icon-bg-soft); }
.sw-i-primary{ fill: rgb(var(--usk-primary-rgb, 80 160 255) / .2); stroke: var(--sw-icon-primary); }
.sw-i-secondary{ fill: rgb(var(--usk-secondary-rgb, 138 116 255) / .2); stroke: var(--sw-icon-secondary); }
.sw-i-accent{ fill: rgb(var(--usk-accent-rgb, 255 170 76) / .22); stroke: var(--sw-icon-accent); }
.sw-i-success{ fill: rgb(var(--usk-success-rgb, 74 222 128) / .2); stroke: var(--sw-icon-success); }
.sw-i-warning{ fill: rgb(var(--usk-warning-rgb, 255 200 80) / .22); stroke: var(--sw-icon-warning); }
.sw-i-danger{ fill: rgb(var(--usk-danger-rgb, 255 92 122) / .2); stroke: var(--sw-icon-danger); }
.sw-i-line{ fill: none; stroke: var(--sw-icon-primary); stroke-width: 6.5; stroke-linecap: round; stroke-linejoin: round; }
.sw-i-line-2{ fill: none; stroke: var(--sw-icon-secondary); stroke-width: 4.7; stroke-linecap: round; stroke-linejoin: round; }
.sw-i-line-3{ fill: none; stroke: var(--sw-icon-accent); stroke-width: 3.8; stroke-linecap: round; stroke-linejoin: round; }
.sw-i-muted{ fill: none; stroke: var(--sw-icon-muted); stroke-width: 2.8; stroke-linecap: round; stroke-linejoin: round; }
.sw-i-surface{ fill: var(--sw-icon-bg); stroke: var(--sw-icon-border); stroke-width: 4.5; }

[data-icon-frame]{opacity:var(--usk-icon-frame-opacity,1)}
[data-icon-frame="decor"]{opacity:var(--usk-icon-frame-decor-opacity,.18)}
[data-icon-glyph="play"]{fill:var(--usk-icon-play,var(--usk-icon-foreground,rgb(var(--usk-text-rgb,255 255 255))));stroke:none;opacity:1}
</style>
<defs>
    <linearGradient id="menu-bg" x1="28" y1="24" x2="228" y2="232" gradientUnits="userSpaceOnUse">
      <stop stop-color="rgb(var(--usk-surface-strong-rgb, 37 17 91))"/>
      <stop offset=".48" stop-color="rgb(var(--usk-surface-rgb, 19 8 47))"/>
      <stop offset="1" stop-color="rgb(var(--usk-bg-rgb, 9 5 28))"/>
    </linearGradient>
    <linearGradient id="menu-neon" x1="48" y1="36" x2="214" y2="218" gradientUnits="userSpaceOnUse">
      <stop stop-color="var(--sw-icon-primary, rgb(var(--usk-primary-rgb, 32 244 255)))"/>
      <stop offset=".45" stop-color="var(--sw-icon-secondary, rgb(var(--usk-secondary-rgb, 255 43 214)))"/>
      <stop offset="1" stop-color="var(--sw-icon-accent, rgb(var(--usk-accent-rgb, 255 209 102)))"/>
    </linearGradient>
    <linearGradient id="menu-chrome" x1="56" y1="42" x2="204" y2="214" gradientUnits="userSpaceOnUse">
      <stop stop-color="rgb(var(--usk-surface-strong-rgb, 255 247 255))"/>
      <stop offset=".18" stop-color="var(--sw-icon-primary, rgb(var(--usk-primary-rgb, 32 244 255)))"/>
      <stop offset=".48" stop-color="var(--sw-icon-secondary, rgb(var(--usk-secondary-rgb, 111 44 255)))"/>
      <stop offset=".76" stop-color="var(--sw-icon-secondary, rgb(var(--usk-secondary-rgb, 255 43 214)))"/>
      <stop offset="1" stop-color="var(--sw-icon-accent, rgb(var(--usk-accent-rgb, 255 209 102)))"/>
    </linearGradient>
    <linearGradient id="menu-sun" x1="70" y1="52" x2="185" y2="164" gradientUnits="userSpaceOnUse">
      <stop stop-color="var(--sw-icon-accent, rgb(var(--usk-accent-rgb, 255 209 102)))"/>
      <stop offset=".5" stop-color="var(--sw-icon-warning, rgb(var(--usk-warning-rgb, 255 138 61)))"/>
      <stop offset="1" stop-color="var(--sw-icon-secondary, rgb(var(--usk-secondary-rgb, 255 43 214)))"/>
    </linearGradient>
    <filter id="menu-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4.5" result="blur"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="menu-clip"><rect x="18" y="18" width="220" height="220" rx="48"/></clipPath>
  </defs>
  <rect data-icon-frame="surface" x="18" y="18" width="220" height="220" rx="48" fill="url(#menu-bg)"/>


<g clip-path="url(#menu-clip)">

                    <path data-icon-frame="decor" class="sw-i-line-3" d="M48 204H208M76 218H180" opacity=".72"/>

                    <path fill="none" d="M70 87H186M70 128H186M70 169H186" stroke="var(--sw-icon-primary, rgb(var(--usk-primary-rgb, 32 244 255)))" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" filter="url(#menu-glow)"/><circle cx="82" cy="87" r="7" fill="var(--sw-icon-accent, rgb(var(--usk-accent-rgb, 255 209 102)))"/><circle cx="174" cy="128" r="7" fill="var(--sw-icon-secondary, rgb(var(--usk-secondary-rgb, 255 43 214)))"/><circle cx="82" cy="169" r="7" fill="var(--sw-icon-accent, rgb(var(--usk-accent-rgb, 255 209 102)))"/>
                  </g>

<rect data-icon-frame="surface" x="18" y="18" width="220" height="220" rx="48" fill="none" stroke="url(#menu-neon)" stroke-width="4"/>
</svg>
