<svg overflow="visible" xmlns="http://www.w3.org/2000/svg" class="bento-icon" width="256" height="256" viewBox="0 0 256 256" role="img" aria-labelledby="layers-title layers-desc">
  <title id="layers-title">Layers</title>
  <desc id="layers-desc">Theme-aware Bento SVG icon with modular tile styling and UI Style Kit color variables. Semantic meaning: Stacked layers, versions, z-order.</desc>
  <style>
.bi-bg{fill:var(--bento-icon-bg,rgb(var(--usk-surface-rgb,255 255 255)/.98))}
.bi-bg-strong{fill:var(--bento-icon-bg-strong,rgb(var(--usk-surface-strong-rgb,245 247 250)/.96))}
.bi-bg-soft{fill:var(--bento-icon-bg-soft,rgb(var(--usk-surface-soft-rgb,232 238 248)/.82))}
.bi-primary{fill:var(--bento-icon-primary-soft,rgb(var(--usk-primary-rgb,74 111 255)/.16));stroke:var(--bento-icon-primary,rgb(var(--usk-primary-rgb,74 111 255)))}
.bi-secondary{fill:var(--bento-icon-secondary-soft,rgb(var(--usk-secondary-rgb,117 132 170)/.16));stroke:var(--bento-icon-secondary,rgb(var(--usk-secondary-rgb,117 132 170)))}
.bi-accent{fill:var(--bento-icon-accent-soft,rgb(var(--usk-accent-rgb,255 151 94)/.18));stroke:var(--bento-icon-accent,rgb(var(--usk-accent-rgb,255 151 94)))}
.bi-success{fill:rgb(var(--usk-success-rgb,44 174 118)/.2);stroke:var(--bento-icon-success,rgb(var(--usk-success-rgb,44 174 118)))}
.bi-warning{fill:rgb(var(--usk-warning-rgb,224 151 45)/.22);stroke:var(--bento-icon-warning,rgb(var(--usk-warning-rgb,224 151 45)))}
.bi-danger{fill:rgb(var(--usk-danger-rgb,225 79 79)/.18);stroke:var(--bento-icon-danger,rgb(var(--usk-danger-rgb,225 79 79)))}
.bi-line{fill:none;stroke:var(--bento-icon-primary,rgb(var(--usk-primary-rgb,74 111 255)));stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
.bi-line-2{fill:none;stroke:var(--bento-icon-secondary,rgb(var(--usk-secondary-rgb,117 132 170)));stroke-width:4.45;stroke-linecap:round;stroke-linejoin:round}
.bi-line-3{fill:none;stroke:var(--bento-icon-accent,rgb(var(--usk-accent-rgb,255 151 94)));stroke-width:3.75;stroke-linecap:round;stroke-linejoin:round}
.bi-muted{fill:none;stroke:var(--bento-icon-muted,rgb(var(--usk-text-muted-rgb,105 116 130)));stroke-width:2.65;stroke-linecap:round;stroke-linejoin:round}
.bi-surface{fill:var(--bento-icon-bg,rgb(var(--usk-surface-rgb,255 255 255)/.98));stroke:var(--bento-icon-border,rgb(var(--usk-border-rgb,190 199 214)/.62));stroke-width:4}
.bi-chip{fill:var(--bento-icon-bg-soft,rgb(var(--usk-surface-soft-rgb,232 238 248)/.82));stroke:var(--bento-icon-border,rgb(var(--usk-border-rgb,190 199 214)/.62));stroke-width:3}
[data-icon-frame]{opacity:var(--usk-icon-frame-opacity,1)}
[data-icon-frame="decor"]{opacity:var(--usk-icon-frame-decor-opacity,var(--usk-icon-frame-opacity,1))}
[data-icon-glyph="play"]{fill:var(--usk-icon-play,var(--usk-icon-foreground,rgb(var(--usk-text-rgb,255 255 255))));stroke:none;opacity:1}
</style>
<rect data-icon-frame="surface" class="bi-surface" x="26" y="28" width="204" height="200" rx="38"/>


  <path data-icon-frame="decor" class="bi-muted" d="M48 52H84M172 52H208M52 210H98M158 210H204" opacity=".42"/>


<path class="bi-primary" stroke-width="5" d="M128 62L203 104L128 146L53 104Z"/>
<path class="bi-line-2" d="M63 132L128 169L193 132M63 160L128 197L193 160"/>
<rect class="bi-bg-strong" x="102" y="94" width="52" height="20" rx="10"/>

</svg>
