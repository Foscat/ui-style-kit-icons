<svg overflow="visible" xmlns="http://www.w3.org/2000/svg" class="brutal-icon" width="256" height="256" viewBox="0 0 256 256" role="img" aria-labelledby="bell-title bell-desc">
  <title id="bell-title">Notifications</title>
  <desc id="bell-desc">Theme-aware brutalist SVG icon with hard outlines, block shapes, and UI Style Kit color variables. Semantic meaning: Alerts, reminders, updates.</desc>
  <style>
.brutal-i-bg{fill:var(--brutal-icon-bg,rgb(var(--usk-surface-rgb,255 255 255)/1))}
.brutal-i-bg-strong{fill:var(--brutal-icon-bg-strong,rgb(var(--usk-surface-strong-rgb,255 255 255)/1))}
.brutal-i-bg-soft{fill:var(--brutal-icon-bg-soft,rgb(var(--usk-surface-soft-rgb,238 238 238)/.92))}
.brutal-i-primary{fill:var(--brutal-icon-primary,rgb(var(--usk-primary-rgb,255 210 0)));stroke:var(--brutal-icon-border,rgb(var(--usk-border-rgb,0 0 0)));stroke-width:6}
.brutal-i-secondary{fill:var(--brutal-icon-secondary,rgb(var(--usk-secondary-rgb,0 119 255)));stroke:var(--brutal-icon-border,rgb(var(--usk-border-rgb,0 0 0)));stroke-width:6}
.brutal-i-accent{fill:var(--brutal-icon-accent,rgb(var(--usk-accent-rgb,255 45 85)));stroke:var(--brutal-icon-border,rgb(var(--usk-border-rgb,0 0 0)));stroke-width:6}
.brutal-i-success{fill:var(--brutal-icon-success,rgb(var(--usk-success-rgb,0 170 88)));stroke:var(--brutal-icon-border,rgb(var(--usk-border-rgb,0 0 0)));stroke-width:6}
.brutal-i-warning{fill:var(--brutal-icon-warning,rgb(var(--usk-warning-rgb,255 174 0)));stroke:var(--brutal-icon-border,rgb(var(--usk-border-rgb,0 0 0)));stroke-width:6}
.brutal-i-danger{fill:var(--brutal-icon-danger,rgb(var(--usk-danger-rgb,230 35 35)));stroke:var(--brutal-icon-border,rgb(var(--usk-border-rgb,0 0 0)));stroke-width:6}
.brutal-i-line{fill:none;stroke:var(--brutal-icon-border,rgb(var(--usk-border-rgb,0 0 0)));stroke-width:9;stroke-linecap:square;stroke-linejoin:miter}
.brutal-i-line-2{fill:none;stroke:var(--brutal-icon-accent,rgb(var(--usk-accent-rgb,255 45 85)));stroke-width:6.5;stroke-linecap:square;stroke-linejoin:miter}
.brutal-i-line-3{fill:none;stroke:var(--brutal-icon-secondary,rgb(var(--usk-secondary-rgb,0 119 255)));stroke-width:5.25;stroke-linecap:square;stroke-linejoin:miter}
.brutal-i-muted{fill:none;stroke:var(--brutal-icon-muted,rgb(var(--usk-text-muted-rgb,75 75 75)));stroke-width:4;stroke-linecap:square;stroke-linejoin:miter}
.brutal-i-surface{fill:var(--brutal-icon-bg,rgb(var(--usk-surface-rgb,255 255 255)/1));stroke:var(--brutal-icon-border,rgb(var(--usk-border-rgb,0 0 0)));stroke-width:7}
[data-icon-frame]{opacity:var(--usk-icon-frame-opacity,1)}
[data-icon-frame="decor"]{opacity:var(--usk-icon-frame-decor-opacity,var(--usk-icon-frame-opacity,1))}
[data-icon-glyph="play"]{fill:var(--usk-icon-play,var(--usk-icon-foreground,rgb(var(--usk-text-rgb,255 255 255))));stroke:none;opacity:1}
</style>
  <rect data-icon-frame="decor" class="brutal-i-primary" x="40" y="42" width="188" height="188"/>
  <rect data-icon-frame="decor" class="brutal-i-surface" x="28" y="28" width="188" height="188"/>
  <path class="brutal-i-muted" d="M48 64H94M150 64H196M48 194H104M144 194H196"/>
  <path class="brutal-i-bg-strong" stroke="var(--brutal-icon-border,rgb(var(--usk-border-rgb,0 0 0)))" stroke-width="8" d="M84 151V116C84 89 102 70 128 70C154 70 172 89 172 116V151L190 178H66Z"/><path class="brutal-i-line-2" d="M112 192H144"/><rect class="brutal-i-danger" x="162" y="58" width="32" height="32"/>
</svg>
