<svg overflow="visible" class="sw-icon" xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-labelledby="activity-title activity-desc">
  <title id="activity-title">Activity</title>
  <desc id="activity-desc">Theme-aware synthwave SVG icon with neon styling and UI Style Kit color variables. Semantic meaning: Pulse, usage, live status.</desc>
  <style>
[data-icon-frame]{opacity:var(--usk-icon-frame-opacity,1)}
[data-icon-frame="decor"]{opacity:var(--usk-icon-frame-decor-opacity,var(--usk-icon-frame-opacity,1))}
[data-icon-glyph="play"]{fill:var(--usk-icon-play,var(--usk-icon-foreground,rgb(var(--usk-text-rgb,255 255 255))));stroke:none;opacity:1}
</style>
  
  <defs>
    <linearGradient id="lightning-bg" x1="32" y1="28" x2="224" y2="228" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="rgb(var(--usk-surface-strong-rgb, 32 16 74))"/>
      <stop offset=".42" stop-color="rgb(var(--usk-surface-rgb, 19 8 47))"/>
      <stop offset="1" stop-color="rgb(var(--usk-bg-rgb, 9 5 28))"/>
    </linearGradient>
    <linearGradient id="lightning-sun" x1="72" y1="52" x2="184" y2="158" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="rgb(var(--usk-accent-rgb, 255 209 102))"/>
      <stop offset=".48" stop-color="rgb(var(--usk-warning-rgb, 255 138 61))"/>
      <stop offset="1" stop-color="rgb(var(--usk-secondary-rgb, 255 43 214))"/>
    </linearGradient>
    <linearGradient id="lightning-neon" x1="52" y1="48" x2="204" y2="208" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="rgb(var(--usk-primary-rgb, 32 244 255))"/>
      <stop offset=".52" stop-color="rgb(var(--usk-secondary-rgb, 255 43 214))"/>
      <stop offset="1" stop-color="rgb(var(--usk-accent-rgb, 255 209 102))"/>
    </linearGradient>
    <linearGradient id="lightning-chrome" x1="64" y1="48" x2="192" y2="212" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="rgb(var(--usk-surface-strong-rgb, 255 247 255))"/>
      <stop offset=".2" stop-color="rgb(var(--usk-primary-rgb, 32 244 255))"/>
      <stop offset=".5" stop-color="rgb(var(--usk-secondary-rgb, 111 44 255))"/>
      <stop offset=".78" stop-color="rgb(var(--usk-secondary-rgb, 255 79 163))"/>
      <stop offset="1" stop-color="rgb(var(--usk-accent-rgb, 255 209 102))"/>
    </linearGradient>
    <filter id="lightning-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="1 0 0 0 0.95  0 1 0 0 0.2  0 0 1 0 1  0 0 0 .75 0"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="lightning-clip"><rect x="18" y="18" width="220" height="220" rx="48"/></clipPath>
  </defs>
  <rect data-icon-frame="decor" x="18" y="18" width="220" height="220" rx="48" fill="url(#lightning-bg)"/>
  <g clip-path="url(#lightning-clip)">
    <g data-icon-frame="decor" class="sw-i-horizon-sun" opacity=".52"><path d="M70 170A58 58 0 0 1 186 170H70Z" fill="url(#lightning-sun)" opacity=".58"/><path d="M86 132H170M78 148H178M70 164H186" fill="none" stroke="rgb(var(--usk-surface-rgb, 19 8 47))" stroke-width="6" stroke-linecap="round" opacity=".5"/></g>
    <path d="M35 168H221M49 186H207M67 204H189" stroke="rgb(var(--usk-primary-rgb, 32 244 255))" stroke-width="3" opacity=".55"/>
    <path d="M30 232L104 156M226 232L152 156M62 232L114 156M194 232L142 156M96 232L123 156M160 232L133 156" stroke="rgb(var(--usk-secondary-rgb, 255 43 214))" stroke-width="2" opacity=".45"/>
    <path d="M20 214H236" stroke="rgb(var(--usk-accent-rgb, 255 209 102))" stroke-width="4" opacity=".5"/>
    
    <path d="M144 48L73 138H123L103 211L184 111H136Z" fill="url(#lightning-sun)" stroke="rgb(var(--usk-primary-rgb, 32 244 255))" stroke-width="7" stroke-linejoin="round" filter="url(#lightning-glow)"/>
    <path d="M113 115L143 77L130 124H159L121 173L133 130H101Z" fill="rgb(var(--usk-surface-strong-rgb, 255 247 255))" opacity=".34"/>
  </g>
  <rect data-icon-frame="decor" x="18" y="18" width="220" height="220" rx="48" fill="none" stroke="url(#lightning-neon)" stroke-width="4"/>
</svg>
