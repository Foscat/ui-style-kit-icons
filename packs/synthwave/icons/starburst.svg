<svg overflow="visible" class="sw-icon" xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-labelledby="starburst-title starburst-desc">
  <title id="starburst-title">starburst</title>
  <desc id="starburst-desc">Theme-aware synthwave SVG icon with neon styling and UI Style Kit color variables. Semantic meaning: starburst.</desc>
  <style>
[data-icon-frame]{opacity:var(--usk-icon-frame-opacity,1)}
[data-icon-frame="decor"]{opacity:var(--usk-icon-frame-decor-opacity,.22)}
[data-icon-glyph="play"]{fill:var(--usk-icon-play,var(--usk-icon-foreground,rgb(var(--usk-text-rgb,255 255 255))));stroke:none;opacity:1}
</style>

  <defs>
    <linearGradient id="starburst-bg" x1="32" y1="28" x2="224" y2="228" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="rgb(var(--usk-surface-strong-rgb, 32 16 74))"/>
      <stop offset=".42" stop-color="rgb(var(--usk-surface-rgb, 19 8 47))"/>
      <stop offset="1" stop-color="rgb(var(--usk-bg-rgb, 9 5 28))"/>
    </linearGradient>
    <linearGradient id="starburst-sun" x1="72" y1="52" x2="184" y2="158" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="var(--sw-icon-accent, rgb(var(--usk-accent-rgb, 255 209 102)))"/>
      <stop offset=".48" stop-color="var(--sw-icon-warning, rgb(var(--usk-warning-rgb, 255 138 61)))"/>
      <stop offset="1" stop-color="var(--sw-icon-secondary, rgb(var(--usk-secondary-rgb, 255 43 214)))"/>
    </linearGradient>
    <linearGradient id="starburst-neon" x1="52" y1="48" x2="204" y2="208" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="var(--sw-icon-primary, rgb(var(--usk-primary-rgb, 32 244 255)))"/>
      <stop offset=".52" stop-color="var(--sw-icon-secondary, rgb(var(--usk-secondary-rgb, 255 43 214)))"/>
      <stop offset="1" stop-color="var(--sw-icon-accent, rgb(var(--usk-accent-rgb, 255 209 102)))"/>
    </linearGradient>
    <linearGradient id="starburst-chrome" x1="64" y1="48" x2="192" y2="212" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="rgb(var(--usk-surface-strong-rgb, 255 247 255))"/>
      <stop offset=".2" stop-color="var(--sw-icon-primary, rgb(var(--usk-primary-rgb, 32 244 255)))"/>
      <stop offset=".5" stop-color="var(--sw-icon-secondary, rgb(var(--usk-secondary-rgb, 111 44 255)))"/>
      <stop offset=".78" stop-color="var(--sw-icon-secondary, rgb(var(--usk-secondary-rgb, 255 79 163)))"/>
      <stop offset="1" stop-color="var(--sw-icon-accent, rgb(var(--usk-accent-rgb, 255 209 102)))"/>
    </linearGradient>
    <filter id="starburst-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="starburst-clip"><rect x="18" y="18" width="220" height="220" rx="48"/></clipPath>
  </defs>
  <rect data-icon-frame="surface" x="18" y="18" width="220" height="220" rx="48" fill="url(#starburst-bg)"/>
  <g clip-path="url(#starburst-clip)">
    <g data-icon-frame="decor"><circle cx="128" cy="100" r="58" fill="url(#starburst-sun)" opacity=".24"/></g>
    <path data-icon-frame="decor" class="sw-i-line-3" d="M48 204H208M76 218H180" opacity=".72"/>

    <path fill="none" data-icon-frame="decor" d="M20 214H236" stroke="var(--sw-icon-accent, rgb(var(--usk-accent-rgb, 255 209 102)))" stroke-width="4" opacity=".5"/>

    <path d="M128 50L146 105L204 89L164 133L206 176L148 162L128 217L108 162L50 176L92 133L52 89L110 105Z" fill="url(#starburst-chrome)" stroke="var(--sw-icon-primary, rgb(var(--usk-primary-rgb, 32 244 255)))" stroke-width="5" stroke-linejoin="round" filter="url(#starburst-glow)"/>
    <circle cx="128" cy="134" r="31" fill="rgb(var(--usk-surface-rgb, 19 8 47))" stroke="var(--sw-icon-accent, rgb(var(--usk-accent-rgb, 255 209 102)))" stroke-width="7"/>
    <path fill="none" d="M116 134H140M128 122V146" stroke="var(--sw-icon-secondary, rgb(var(--usk-secondary-rgb, 255 43 214)))" stroke-width="7" stroke-linecap="round"/>
  </g>
  <rect data-icon-frame="surface" x="18" y="18" width="220" height="220" rx="48" fill="none" stroke="url(#starburst-neon)" stroke-width="4"/>
</svg>
