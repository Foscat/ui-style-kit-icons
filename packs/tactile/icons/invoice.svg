.tactile-i-shadow{fill:var(--tactile-icon-shadow,rgb(var(--usk-border-rgb,15 23 42)/.2));stroke:none}
.tactile-i-highlight{fill:none;stroke:var(--tactile-icon-highlight,rgb(var(--usk-surface-strong-rgb,255 255 255)/.64));stroke-width:4.2;stroke-linecap:round}
.tactile-i-lowlight{fill:none;stroke:var(--tactile-icon-lowlight,rgb(var(--usk-border-rgb,15 23 42)/.22));stroke-width:4.2;stroke-linecap:round}
.tactile-i-inset{fill:var(--tactile-icon-bg-soft,rgb(var(--usk-surface-soft-rgb,226 232 240)/.82));stroke:var(--tactile-icon-lowlight,rgb(var(--usk-border-rgb,15 23 42)/.22));stroke-width:3.2}
.tactile-i-glow{filter:drop-shadow(0 2px 2px var(--tactile-icon-highlight,rgb(var(--usk-surface-strong-rgb,255 255 255)/.64)))}
[data-icon-frame]{opacity:var(--usk-icon-frame-opacity,1)}
[data-icon-frame="decor"]{opacity:var(--usk-icon-frame-decor-opacity,var(--usk-icon-frame-opacity,1))}
[data-icon-glyph="play"]{fill:var(--usk-icon-play,var(--usk-icon-foreground,rgb(var(--usk-text-rgb,255 255 255))));stroke:none;opacity:1}
</style>
