  <circle data-icon-material="body" data-icon-detail="paint-well" class="tactile-i-secondary" cx="119" cy="84" r="11" stroke-width="4.5"/>
  <circle data-icon-material="body" data-icon-detail="paint-well" class="tactile-i-warning" cx="154" cy="104" r="12" stroke-width="4.5"/>
  <circle data-icon-material="body" data-icon-detail="thumb-hole" class="tactile-i-bg-strong" cx="116" cy="157" r="16" stroke="var(--tactile-icon-secondary,rgb(var(--usk-secondary-rgb,100 116 139)))" stroke-width="4.7"/>
  <path data-icon-material="body" data-icon-detail="brush-handle" class="tactile-i-secondary" stroke-width="4.8" d="M157 183L201 91L214 98L173 190Z"/>
  <path data-icon-detail="brush-ferrule" class="tactile-i-line-3" d="M188 116L203 123"/>
  <path data-icon-audit="decorative" data-icon-material="highlight" class="tactile-i-highlight" d="M124 55C82 55 48 87 48 128M158 181L199 94"/>
  <path data-icon-audit="decorative" data-icon-material="lowlight" class="tactile-i-lowlight" d="M208 132C208 147 201 156 190 156C178 156 169 164 169 176C169 190 158 200 143 200H125M173 189L211 100"/>
</g>

</svg>
