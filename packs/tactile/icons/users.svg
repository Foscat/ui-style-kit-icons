<svg overflow="visible" xmlns="http://www.w3.org/2000/svg" class="tactile-icon" width="256" height="256" viewBox="0 0 256 256" role="img" aria-labelledby="users-title users-desc">
  <title id="users-title">Users</title>
  <desc id="users-desc">Theme-aware Skeuomorphic / Tactile SVG icon with raised surfaces, inset grooves, bevel highlights, and UI Style Kit color variables. Semantic meaning: Audience, team, members, group.</desc>
  <style>
.tactile-i-bg{fill:var(--tactile-icon-bg,rgb(var(--usk-surface-rgb,248 250 252)/.96))}
.tactile-i-bg-strong{fill:var(--tactile-icon-bg-strong,rgb(var(--usk-surface-strong-rgb,255 255 255)/.98))}
.tactile-i-bg-soft{fill:var(--tactile-icon-bg-soft,rgb(var(--usk-surface-soft-rgb,226 232 240)/.82))}
.tactile-i-primary{fill:var(--tactile-icon-primary-soft,rgb(var(--usk-primary-rgb,37 99 235)/.16));stroke:var(--tactile-icon-primary,rgb(var(--usk-primary-rgb,37 99 235)))}
.tactile-i-secondary{fill:var(--tactile-icon-secondary-soft,rgb(var(--usk-secondary-rgb,100 116 139)/.14));stroke:var(--tactile-icon-secondary,rgb(var(--usk-secondary-rgb,100 116 139)))}
.tactile-i-accent{fill:var(--tactile-icon-accent-soft,rgb(var(--usk-accent-rgb,14 165 233)/.16));stroke:var(--tactile-icon-accent,rgb(var(--usk-accent-rgb,14 165 233)))}
.tactile-i-success{fill:rgb(var(--usk-success-rgb,22 163 74)/.16);stroke:var(--tactile-icon-success,rgb(var(--usk-success-rgb,22 163 74)))}
.tactile-i-warning{fill:rgb(var(--usk-warning-rgb,202 138 4)/.17);stroke:var(--tactile-icon-warning,rgb(var(--usk-warning-rgb,202 138 4)))}
.tactile-i-danger{fill:rgb(var(--usk-danger-rgb,220 38 38)/.15);stroke:var(--tactile-icon-danger,rgb(var(--usk-danger-rgb,220 38 38)))}
.tactile-i-line{fill:none;stroke:var(--tactile-icon-primary,rgb(var(--usk-primary-rgb,37 99 235)));stroke-width:6.3;stroke-linecap:round;stroke-linejoin:round}
.tactile-i-line-2{fill:none;stroke:var(--tactile-icon-secondary,rgb(var(--usk-secondary-rgb,100 116 139)));stroke-width:4.7;stroke-linecap:round;stroke-linejoin:round}
.tactile-i-line-3{fill:none;stroke:var(--tactile-icon-accent,rgb(var(--usk-accent-rgb,14 165 233)));stroke-width:3.9;stroke-linecap:round;stroke-linejoin:round}
.tactile-i-muted{fill:none;stroke:var(--tactile-icon-muted,rgb(var(--usk-text-muted-rgb,100 116 139)));stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.tactile-i-fill-muted{fill:var(--tactile-icon-muted,rgb(var(--usk-text-muted-rgb,100 116 139)));stroke:none}
.tactile-i-surface{fill:var(--tactile-icon-bg,rgb(var(--usk-surface-rgb,248 250 252)/.96));stroke:var(--tactile-icon-border,rgb(var(--usk-border-rgb,100 116 139)/.66));stroke-width:4.4}
.tactile-i-shadow{fill:var(--tactile-icon-shadow,rgb(var(--usk-border-rgb,15 23 42)/.2));stroke:none}
.tactile-i-highlight{fill:none;stroke:var(--tactile-icon-highlight,rgb(var(--usk-surface-strong-rgb,255 255 255)/.64));stroke-width:4.2;stroke-linecap:round}
.tactile-i-lowlight{fill:none;stroke:var(--tactile-icon-lowlight,rgb(var(--usk-border-rgb,15 23 42)/.22));stroke-width:4.2;stroke-linecap:round}
.tactile-i-inset{fill:var(--tactile-icon-bg-soft,rgb(var(--usk-surface-soft-rgb,226 232 240)/.82));stroke:var(--tactile-icon-lowlight,rgb(var(--usk-border-rgb,15 23 42)/.22));stroke-width:3.2}
.tactile-i-glow{filter:drop-shadow(0 2px 2px var(--tactile-icon-highlight,rgb(var(--usk-surface-strong-rgb,255 255 255)/.64)))}
[data-icon-frame]{opacity:var(--usk-icon-frame-opacity,1)}
[data-icon-frame="decor"]{opacity:var(--usk-icon-frame-decor-opacity,var(--usk-icon-frame-opacity,1))}
[data-icon-glyph="play"]{fill:var(--usk-icon-play,var(--usk-icon-foreground,rgb(var(--usk-text-rgb,255 255 255))));stroke:none;opacity:1}
</style>
  <rect data-icon-frame="surface" class="tactile-i-shadow" x="35" y="37" width="194" height="194" rx="35"/>
  <rect data-icon-frame="surface" class="tactile-i-surface" x="27" y="25" width="198" height="198" rx="34"/>
  <path data-icon-frame="decor" class="tactile-i-highlight" d="M54 45H104M45 56V92" opacity=".82"/>
  <path data-icon-frame="decor" class="tactile-i-lowlight" d="M152 210H198M211 194V208" opacity=".74"/>
  <g data-icon-glyph="semantic" data-icon-prototype="reference-led-v1">
    <!-- Jackets, collars, and badges distinguish three raised desk figurines. -->
    <path data-icon-audit="decorative" data-icon-material="shadow" class="tactile-i-shadow" d="M49 188C52 153 65 138 84 138C103 138 116 153 119 188ZM88 205C91 154 106 132 130 132C154 132 169 154 172 205ZM141 188C144 153 157 138 176 138C195 138 208 153 211 188Z" opacity=".5"/>
    <circle data-icon-part="users-head" data-icon-material="body" class="tactile-i-secondary" cx="80" cy="101" r="15" stroke-width="5.2"/>
    <circle data-icon-part="users-head" data-icon-material="body" class="tactile-i-primary" cx="128" cy="82" r="19" stroke-width="6"/>
    <circle data-icon-part="users-head" data-icon-material="body" class="tactile-i-accent" cx="176" cy="101" r="15" stroke-width="5.2"/>
    <path data-icon-part="users-shoulders" data-icon-material="body" class="tactile-i-secondary" stroke-width="5.2" d="M45 181C48 147 61 132 80 132C99 132 112 147 115 181Z"/>
    <path data-icon-part="users-shoulders" data-icon-material="body" class="tactile-i-primary" stroke-width="6" d="M84 198C87 148 103 126 128 126C153 126 169 148 172 198Z"/>
    <path data-icon-part="users-shoulders" data-icon-material="body" class="tactile-i-accent" stroke-width="5.2" d="M141 181C144 147 157 132 176 132C195 132 208 147 211 181Z"/>
    <path data-icon-detail="jacket-collars" class="tactile-i-line-2" d="M67 136L80 153L93 136M108 132L128 157L148 132M163 136L176 153L189 136"/>
    <path data-icon-detail="jacket-seams" class="tactile-i-line-3" d="M80 153V178M128 157V195M176 153V178"/>
    <rect data-icon-detail="name-badge" class="tactile-i-warning" x="137" y="164" width="17" height="10" rx="3" stroke-width="3"/>
    <path data-icon-audit="decorative" data-icon-material="highlight" class="tactile-i-highlight" d="M65 101A15 15 0 0 1 80 86M109 82A19 19 0 0 1 128 63M161 101A15 15 0 0 1 176 86"/>
    <path data-icon-audit="decorative" data-icon-material="lowlight" class="tactile-i-lowlight" d="M80 116A15 15 0 0 0 95 101M128 101A19 19 0 0 0 147 82M176 116A15 15 0 0 0 191 101M45 181H115M84 198H172M141 181H211"/>
  </g>
</svg>
