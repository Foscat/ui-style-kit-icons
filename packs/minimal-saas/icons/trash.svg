.saas-i-danger{fill:rgb(var(--usk-danger-rgb,220 38 38)/.12);stroke:var(--saas-icon-danger,rgb(var(--usk-danger-rgb,220 38 38)))}
.saas-i-line{fill:none;stroke:var(--saas-icon-primary,rgb(var(--usk-primary-rgb,37 99 235)));stroke-width:5.4;stroke-linecap:round;stroke-linejoin:round}
