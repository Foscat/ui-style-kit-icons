<svg overflow="visible" xmlns="http://www.w3.org/2000/svg" class="saas-icon" width="256" height="256" viewBox="-8 -8 272 272" role="img" aria-labelledby="server-title server-desc">
  <title id="server-title">Server</title>
  <desc id="server-desc">Theme-aware Minimal SaaS SVG icon with quiet product UI styling and UI Style Kit color variables. Semantic meaning: Backend service or infrastructure.</desc>
  <style>
.saas-i-bg{fill:var(--saas-icon-bg,rgb(var(--usk-surface-rgb,255 255 255)/.96))}
.saas-i-bg-strong{fill:var(--saas-icon-bg-strong,rgb(var(--usk-surface-strong-rgb,255 255 255)/.98))}
.saas-i-bg-soft{fill:var(--saas-icon-bg-soft,rgb(var(--usk-surface-soft-rgb,241 245 249)/.78))}
.saas-i-primary{fill:var(--saas-icon-primary-soft,rgb(var(--usk-primary-rgb,37 99 235)/.12));stroke:var(--saas-icon-primary,rgb(var(--usk-primary-rgb,37 99 235)))}
.saas-i-secondary{fill:var(--saas-icon-secondary-soft,rgb(var(--usk-secondary-rgb,100 116 139)/.1));stroke:var(--saas-icon-secondary,rgb(var(--usk-secondary-rgb,100 116 139)))}
.saas-i-accent{fill:var(--saas-icon-accent-soft,rgb(var(--usk-accent-rgb,14 165 233)/.12));stroke:var(--saas-icon-accent,rgb(var(--usk-accent-rgb,14 165 233)))}
.saas-i-success{fill:rgb(var(--usk-success-rgb,22 163 74)/.13);stroke:var(--saas-icon-success,rgb(var(--usk-success-rgb,22 163 74)))}
.saas-i-warning{fill:rgb(var(--usk-warning-rgb,202 138 4)/.14);stroke:var(--saas-icon-warning,rgb(var(--usk-warning-rgb,202 138 4)))}
.saas-i-danger{fill:rgb(var(--usk-danger-rgb,220 38 38)/.12);stroke:var(--saas-icon-danger,rgb(var(--usk-danger-rgb,220 38 38)))}
.saas-i-line{fill:none;stroke:var(--saas-icon-primary,rgb(var(--usk-primary-rgb,37 99 235)));stroke-width:5.4;stroke-linecap:round;stroke-linejoin:round}
.saas-i-line-2{fill:none;stroke:var(--saas-icon-secondary,rgb(var(--usk-secondary-rgb,100 116 139)));stroke-width:4.45;stroke-linecap:round;stroke-linejoin:round}
.saas-i-line-3{fill:none;stroke:var(--saas-icon-accent,rgb(var(--usk-accent-rgb,14 165 233)));stroke-width:4.05;stroke-linecap:round;stroke-linejoin:round}
.saas-i-muted{fill:none;stroke:var(--saas-icon-muted,rgb(var(--usk-text-muted-rgb,100 116 139)));stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.saas-i-fill-muted{fill:var(--saas-icon-muted,rgb(var(--usk-text-muted-rgb,100 116 139)));stroke:none}
.saas-i-surface{fill:var(--saas-icon-bg,rgb(var(--usk-surface-rgb,255 255 255)/.96));stroke:var(--saas-icon-border,rgb(var(--usk-border-rgb,203 213 225)/.62));stroke-width:3.2}
.saas-i-glow{filter:none}
