    <path data-icon-glass="refraction" data-icon-detail="link-refraction" class="rg-i-line-2" d="M96 100L108 112M148 144L160 156"/>
    <path data-icon-audit="decorative" data-icon-glass="rim" class="rg-i-rim" d="M46 128A22 22 0 0 1 68 106M106 64A22 22 0 0 1 128 42M166 128A22 22 0 0 1 188 106M106 192A22 22 0 0 1 128 170M68 150A22 22 0 0 0 90 128M128 86A22 22 0 0 0 150 64M188 150A22 22 0 0 0 210 128M128 214A22 22 0 0 0 150 192"/>
    <path data-icon-audit="decorative" class="rg-i-sheen" d="M53 114C58 109 63 108 69 108M113 50C118 45 123 44 129 44M173 114C178 109 183 108 189 108M113 178C118 173 123 172 129 172"/>
  </g>
</svg>
