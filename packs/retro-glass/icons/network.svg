    <path data-icon-part="network-connector" class="rg-i-line-2" d="M174 143L142 175"/>
    <path data-icon-part="network-connector" class="rg-i-line-2" d="M90 128L166 128"/>
    <circle data-icon-part="network-node" data-icon-glass="body" class="rg-i-secondary" cx="68" cy="128" r="22" stroke-width="4.7"/>
    <circle data-icon-part="network-node" data-icon-glass="body" class="rg-i-primary" cx="128" cy="64" r="22" stroke-width="6.2"/>
    <circle data-icon-part="network-node" data-icon-glass="body" class="rg-i-secondary" cx="188" cy="128" r="22" stroke-width="4.7"/>
    <circle data-icon-part="network-node" data-icon-glass="body" class="rg-i-accent" cx="128" cy="192" r="22" stroke-width="4.7"/>
