<svg overflow="visible" xmlns="http://www.w3.org/2000/svg" class="rg-icon" width="256" height="256" viewBox="0 0 256 256" role="img" aria-labelledby="bug-title bug-desc">
  <title id="bug-title">Bug</title>
  <desc id="bug-desc">Theme-aware retro-glass SVG icon with translucent glassmorphism styling and UI Style Kit color variables. Semantic meaning: Issue, defect, debug.</desc>
  <style>
.rg-i-bg{fill:var(--rg-icon-bg,rgb(var(--usk-surface-rgb,255 255 255)/.42))}
.rg-i-bg-strong{fill:var(--rg-icon-bg-strong,rgb(var(--usk-surface-strong-rgb,255 255 255)/.62))}
