  <circle data-icon-glass="body" data-icon-detail="paint-well" class="rg-i-secondary" cx="120" cy="78" r="12" stroke-width="4.5"/>
  <circle data-icon-glass="body" data-icon-detail="paint-well" class="rg-i-warning" cx="161" cy="103" r="13" stroke-width="4.5"/>
  <circle data-icon-glass="body" data-icon-detail="thumb-opening" class="rg-i-bg-strong" cx="116" cy="164" r="18" stroke="var(--rg-icon-secondary,rgb(var(--usk-secondary-rgb,140 183 201)))" stroke-width="4.7"/>
  <path data-icon-glass="refraction" data-icon-detail="slab-refraction" class="rg-i-line-3" d="M61 132L177 71M62 161L154 112M136 202L178 161"/>
